<!--
  Monroe Markets — branded OTP / magic-link auth email.
  Source of truth for the Supabase auth email. Paste into:
  Supabase Dashboard → Authentication → Email Templates → "Magic Link" (and "Confirm signup").
  Supabase variables: {{ .Token }} = 6-digit code, {{ .ConfirmationURL }}, {{ .SiteURL }}.
  Logo is served from the production domain so it loads in email clients.
  Flat surfaces, square corners, no web fonts: that is the brand system, and it is also the
  only subset mail clients render reliably.
-->
<table width="100%" cellpadding="0" cellspacing="0" role="presentation"
       style="background:#0A0710;padding:48px 0;font-family:'Söhne','Inter Tight','Helvetica Neue',Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center" style="padding:0 16px;">
      <table width="480" cellpadding="0" cellspacing="0" role="presentation"
             style="max-width:480px;background:#151020;border:1px solid #2C2538;">
        <tr>
          <td style="padding:40px 40px 0;" align="center">
            <img src="https://www.monroemarkets.com/monroe-mark.png" width="84" height="48" alt="Monroe Markets"
                 style="display:block;width:84px;height:48px;margin:0 auto;" />
            <div style="margin-top:16px;font-family:'Söhne Mono','IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:16px;letter-spacing:0.14em;text-transform:uppercase;color:#F3F0EA;">
              Monroe Markets
            </div>
          </td>
        </tr>
        <tr>
          <td style="padding:40px 40px 0;" align="left">
            <div style="font-family:'Söhne Mono','IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:16px;letter-spacing:0.14em;text-transform:uppercase;color:#D98AA3;">
              Client sign-in
            </div>
            <div style="margin-top:12px;font-family:'Söhne Schmal','Archivo','Arial Narrow','Helvetica Neue',Arial,sans-serif;font-weight:600;font-size:32px;line-height:34px;letter-spacing:-0.01em;color:#F3F0EA;">
              Your sign-in code
            </div>
            <div style="margin-top:12px;font-size:15px;line-height:23px;color:#AAA5B2;">
              Enter this code to sign in to Monroe Markets. It expires shortly.
            </div>
          </td>
        </tr>
        <tr>
          <td style="padding:32px 40px 0;" align="left">
            <div style="width:20px;height:4px;background:#7A1C3A;font-size:0;line-height:0;">&nbsp;</div>
            <div style="margin-top:12px;background:#1E1829;border:1px solid #2C2538;padding:22px 24px;text-align:center;">
              <span style="font-family:'Söhne Mono','IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-size:34px;line-height:40px;font-weight:500;letter-spacing:10px;padding-left:10px;color:#F3F0EA;">{{ .Token }}</span>
            </div>
          </td>
        </tr>
        <tr>
          <td style="padding:32px 40px 40px;" align="left">
            <div style="border-top:1px solid #2C2538;padding-top:20px;font-size:12px;line-height:18px;color:#AAA5B2;">
              If you didn't request this code, you can ignore this email. We will never ask for your code by email, phone or message.
            </div>
            <div style="margin-top:16px;font-family:'Söhne Mono','IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:16px;letter-spacing:0.14em;text-transform:uppercase;color:#AAA5B2;">
              Accredited investors only · Monroe Markets
            </div>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
